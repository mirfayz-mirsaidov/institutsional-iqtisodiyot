<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MIT, Yale va Stanford — jonli dars</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg1:#1d2a5c; --bg2:#121937; --ink:#eef1ff; --mut:#9aa6d6; --gold:#f7c948; --teal:#3ee6c4;
  --red:#ff4d6d; --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.12);
  --A:#e5355f; --B:#2f74e8; --C:#d39b12; --D:#18a865;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg2);color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0}
.hidden{display:none!important}

/* ---------- fon ---------- */
#bgwrap{position:fixed;inset:0;background:radial-gradient(1200px 700px at 30% 0%,#2a3a7a 0%,var(--bg1) 35%,var(--bg2) 100%);z-index:0}
#net{position:absolute;inset:0;width:100%;height:100%}

/* ---------- host sahna ---------- */
#stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;padding:2.2vh 3.2vw 2vh}
.topbar{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:1.45vh;letter-spacing:.12em;color:var(--gold);padding-bottom:1.3vh;border-bottom:1px solid var(--line)}
.topbar .r{color:var(--mut)} .topbar .live{color:var(--teal)}
#slide{flex:1;position:relative;overflow:hidden;padding-top:3vh}
.bottombar{display:flex;justify-content:space-between;align-items:center;padding-top:1.4vh}
.joinbox{display:flex;align-items:center;gap:1.1vw;font-family:var(--mono);font-size:1.5vh;color:var(--mut);letter-spacing:.08em}
.joinbox .qr{width:6.4vh;height:6.4vh;background:#fff;border-radius:6px;padding:3px}
.joinbox .qr svg{width:100%;height:100%;display:block}
.joinbox b{color:var(--gold);font-size:2.2vh}
.ctrls{display:flex;gap:.6vw;align-items:center}
.cbtn{background:rgba(255,255,255,.08);color:var(--ink);height:4.6vh;min-width:4.6vh;border-radius:10px;font-size:1.8vh;padding:0 1vw;border:1px solid var(--line)}
.cbtn:hover{background:rgba(255,255,255,.16)}
.pbtn{background:linear-gradient(180deg,#ffd666,#f0b429);color:#2a1d00;font-weight:800;height:5vh;border-radius:12px;font-size:2vh;padding:0 1.8vw;box-shadow:0 4px 0 #b9850f,0 8px 24px rgba(247,201,72,.25)}
.pbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #b9850f}

/* ---------- slayd elementlari ---------- */
.a{opacity:0;transform:translateY(22px);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d,0)*.12s + .05s)}
@keyframes up{to{opacity:1;transform:none}}
.kick{font-family:var(--mono);font-size:1.6vh;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;margin-bottom:1.4vh}
h1.t{font-size:5.6vh;font-weight:800;line-height:1.08;letter-spacing:-.02em}
h1.t em{font-style:normal;color:var(--gold)} h1.t i{font-style:normal;color:var(--teal)}
.sub{font-size:2.3vh;color:var(--mut);margin-top:1vh}
.center{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.big{font-size:9vh;font-weight:800;letter-spacing:-.03em;line-height:1}
.grad{background:linear-gradient(90deg,var(--gold),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.cards{display:grid;gap:1.6vw;margin-top:3vh}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2.4vh 1.6vw;position:relative;overflow:hidden}
.card.top{border-top:3px solid var(--teal)} .card.gold{border-top:3px solid var(--gold)} .card.red{border-top:3px solid var(--red)}
.card h3{font-size:2.6vh;font-weight:800;margin-bottom:.6vh}
.card .ic{font-size:3.6vh;margin-bottom:1vh}
.card p{font-size:2vh;line-height:1.45;color:#d9def7}
.card .tag{font-family:var(--mono);font-size:1.4vh;color:var(--gold);letter-spacing:.15em;margin-bottom:.8vh;text-transform:uppercase}
.card .num{font-size:4.6vh;font-weight:800;color:var(--gold);margin:.6vh 0}
.src{position:absolute;bottom:0;left:0;font-family:var(--mono);font-size:1.35vh;color:var(--mut);letter-spacing:.06em}
.take{margin-top:2.6vh;border-left:4px solid var(--gold);background:var(--card);padding:1.8vh 1.4vw;border-radius:0 12px 12px 0;font-size:2.3vh;font-weight:700}
.take span{color:var(--gold)}

/* timeline */
.tl{position:relative;margin-top:6vh;display:grid;gap:1vw}
.tl:before{content:"";position:absolute;left:0;right:0;top:4.4vh;height:3px;background:linear-gradient(90deg,var(--gold),var(--teal));transform-origin:left;animation:grow 1.6s .3s ease forwards;transform:scaleX(0)}
@keyframes grow{to{transform:scaleX(1)}}
.tl .it{text-align:center;padding:0 .4vw}
.tl .y{font-family:var(--mono);font-size:3.2vh;color:var(--gold);font-weight:700}
.tl .dot{width:1.8vh;height:1.8vh;border-radius:50%;background:var(--gold);margin:1vh auto 1.6vh;box-shadow:0 0 0 6px rgba(247,201,72,.2)}
.tl .tt{font-size:2.15vh;font-weight:700;line-height:1.3}
.tl .ts{font-size:1.75vh;color:var(--mut);margin-top:.6vh;line-height:1.35}

/* flow */
.flow{display:flex;align-items:stretch;gap:.8vw;margin-top:5vh}
.flow .st{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2.6vh 1vw;text-align:center}
.flow .st .ic{font-size:5vh} .flow .st h3{font-size:2.7vh;margin:1vh 0 .6vh} .flow .st p{font-size:1.8vh;color:var(--mut);line-height:1.35}
.flow .ar{align-self:center;font-size:4vh;color:var(--gold)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw;margin-top:5vh}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4vh 1.4vw;text-align:center}
.stat .v{font-size:7.5vh;font-weight:800;color:var(--gold);letter-spacing:-.02em}
.stat .l{font-size:2.1vh;color:#d9def7;margin-top:1vh}
.chips{display:flex;flex-wrap:wrap;gap:.8vw;margin-top:3vh}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1vh 1.4vw;font-size:2.1vh;font-weight:700}

/* ---------- test (host) ---------- */
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:2vw}
.qhead h1{font-size:4.4vh;font-weight:800;line-height:1.15;max-width:72vw}
.timer{width:13vh;height:13vh;border-radius:50%;border:.9vh solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:5vh;font-weight:700;flex:none;transition:border-color .3s}
.timer.low{border-color:var(--red);color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.acount{font-size:2.2vh;color:var(--mut);margin-top:1.2vh}
.acount b{color:var(--ink)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;margin-top:4vh;position:relative}
.ans{border-radius:14px;padding:2.6vh 1.4vw;font-size:2.5vh;font-weight:700;display:flex;align-items:center;gap:1.2vw;position:relative;overflow:hidden;min-height:11vh;transition:opacity .5s,filter .5s,transform .5s}
.ans .sh{font-size:3vh;width:4vh;text-align:center;flex:none}
.ans .cnt{position:absolute;right:1.2vw;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:3vh}
.ans .bar{position:absolute;left:0;bottom:0;height:.8vh;background:rgba(255,255,255,.6);transition:width 1s}
.ans.A{background:var(--A)} .ans.B{background:var(--B)} .ans.C{background:var(--C)} .ans.D{background:var(--D)}
.answers.reveal .ans.wrong{opacity:.25;filter:grayscale(.6)}
.answers.reveal .ans.right{transform:scale(1.03);box-shadow:0 0 0 4px #fff,0 0 40px rgba(255,255,255,.35)}
.answers.locked .ans{filter:blur(6px) brightness(.7)}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;text-align:center}
.lock .pad{font-size:7vh;animation:wob 1.2s infinite ease-in-out}
@keyframes wob{50%{transform:rotate(-8deg)}}
.lock h2{font-size:4vh;font-weight:800;margin-top:1vh;text-shadow:0 2px 20px #000}
.lock p{font-size:2vh;color:#dfe4ff;margin-top:.6vh}

/* ---------- lobby ---------- */
#lobby{position:fixed;inset:0;z-index:5;background:radial-gradient(800px 600px at 50% 40%,#2a0f1a 0%,#07080d 60%);display:flex;flex-direction:column;align-items:center;justify-content:center}
#lobby .bigqr{background:#fff;border-radius:20px;padding:2.2vh;width:58vh;height:58vh;box-shadow:0 0 80px rgba(255,77,109,.25)}
#lobby .bigqr svg{width:100%;height:100%;display:block}
#lobby h2{font-size:3.6vh;font-weight:800;margin-top:2.6vh}
#lobby h2 span{color:var(--gold)}
#lobby .url{font-family:var(--mono);color:var(--mut);font-size:1.7vh;margin-top:1vh}
#lobby .pl{position:absolute;left:2vw;bottom:2vh;font-family:var(--mono);color:var(--mut);font-size:1.6vh;letter-spacing:.1em}
#lobby .names{position:absolute;right:2vw;top:2vh;bottom:9vh;width:22vw;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.5vw;overflow:hidden}
#lobby .names span{background:rgba(255,255,255,.08);border-radius:999px;padding:.6vh .9vw;font-size:1.7vh;animation:up .4s forwards}
#lobby .go{position:absolute;right:2vw;bottom:2vh}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:20;background:#000;overflow:hidden}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 10vw}
#intro .l1{font-family:var(--mono);letter-spacing:.5em;font-size:3.4vh;color:#f3eee4;opacity:0;animation:fin 1.4s forwards}
#intro .l2{font-size:2.4vh;color:#a9a29a;margin-top:1.6vh;opacity:0;animation:fin 1.4s .6s forwards}
#intro .yr{font-family:var(--mono);font-size:13vh;font-weight:700;color:#f7c948;opacity:0;animation:zin 1.2s forwards;text-shadow:0 0 40px rgba(247,201,72,.35)}
#intro .pl{font-family:var(--mono);letter-spacing:.4em;font-size:2.2vh;color:#cfc8bd;margin-top:1vh;opacity:0;animation:fin 1s .5s forwards}
#intro .tx{font-size:3.4vh;color:#f2f2f2;max-width:60vw;line-height:1.4;margin-top:3vh;opacity:0;animation:fin 1.4s 1.1s forwards}
#intro .money{font-size:12vh;font-weight:800;color:#3ee6c4;font-family:var(--mono)}
#intro .ml{font-size:2.6vh;color:#ddd;margin-top:.6vh}
#intro .ttl{font-size:9vh;font-weight:800;letter-spacing:-.02em;opacity:0;animation:zin 1.6s forwards}
#intro .out{animation:fout .8s forwards!important}
@keyframes fin{to{opacity:1}} @keyframes fout{to{opacity:0;filter:blur(8px)}}
@keyframes zin{from{opacity:0;transform:scale(1.25);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
#intro .skip{position:absolute;right:2vw;bottom:2vh;background:rgba(255,255,255,.1);color:#ddd;padding:1vh 1.2vw;border-radius:8px;font-size:1.6vh;z-index:3}
#intro .bars:before,#intro .bars:after{content:"";position:absolute;left:0;right:0;height:9vh;background:#000;z-index:2}
#intro .bars:before{top:0} #intro .bars:after{bottom:0}
#intro .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
#intro .flash.on{animation:flash .9s}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

/* ---------- o'yin ---------- */
.ggrid{display:grid;grid-template-columns:repeat(5,1fr);gap:1vw;margin-top:3vh}
.cty{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.8vh 1vw;position:relative;min-height:17vh}
.cty .fl{font-size:4.4vh} .cty h4{font-size:2.3vh;margin-top:.6vh} .cty .yy{font-family:var(--mono);color:var(--gold);font-size:1.6vh}
.cty .sit{font-size:1.5vh;color:var(--mut);margin-top:.6vh;line-height:1.3}
.cty .votes{display:flex;gap:4px;flex-wrap:wrap;margin-top:.8vh}
.cty .votes i{width:1.2vh;height:1.2vh;border-radius:50%;display:block}
.cty.taken{outline:3px solid var(--gc);box-shadow:0 0 30px var(--gc)}
.cty .who{position:absolute;top:1vh;right:1vw;font-weight:800;font-size:1.6vh;color:var(--gc)}
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw;margin-top:3vh}
.grp{border-radius:18px;padding:2.4vh 1.4vw;background:var(--card);border:2px solid var(--gc)}
.grp h3{font-size:3.4vh;color:var(--gc)} .grp .n{font-size:1.8vh;color:var(--mut);margin:.6vh 0 1.2vh}
.grp .mm{display:flex;flex-wrap:wrap;gap:.4vw}
.grp .mm span{font-size:1.6vh;background:rgba(255,255,255,.07);padding:.4vh .7vw;border-radius:999px}
.grp .cc{font-size:2.6vh;font-weight:800;margin-top:1vh}
.grp .op{font-size:1.9vh;color:#dfe4ff;margin-top:1vh;line-height:1.35}
.warp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.warp .yc{font-family:var(--mono);font-size:18vh;font-weight:700;color:var(--gold);text-shadow:0 0 50px rgba(247,201,72,.5)}
.warp .wl{font-size:3vh;color:var(--mut);letter-spacing:.3em;font-family:var(--mono)}
.res{display:grid;grid-template-columns:1.1fr 1fr;gap:2vw;margin-top:2.4vh}
.verdict{font-size:4vh;font-weight:800;margin-top:1vh}
.verdict.good{color:var(--teal)} .verdict.bad{color:var(--red)}
.fact{display:flex;gap:1vw;font-size:2.2vh;line-height:1.4;margin-top:1.8vh}
.fact b{font-family:var(--mono);color:var(--gold)}
.gdpbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:3vh 1.6vw;text-align:center}
.gdpbox .v{font-size:8vh;font-weight:800}
.alt{margin-top:2vh;font-size:1.9vh;color:var(--mut);line-height:1.4}

/* reyting */
.board{display:grid;grid-template-columns:1.2fr 1fr;gap:2.4vw;margin-top:3vh}
.gbar{display:flex;align-items:center;gap:1vw;margin-bottom:2.4vh}
.gbar .nm{width:9vw;font-size:2.6vh;font-weight:800}
.gbar .tr{flex:1;height:6vh;background:rgba(255,255,255,.06);border-radius:12px;overflow:hidden}
.gbar .fi{height:100%;border-radius:12px;width:0;transition:width 1.6s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:1vw;font-family:var(--mono);font-weight:700;font-size:2.2vh;color:#000}
.top5 li{list-style:none;display:flex;justify-content:space-between;font-size:2.4vh;padding:1.2vh 1vw;border-bottom:1px solid var(--line)}
.top5 li b{font-family:var(--mono);color:var(--gold)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

/* ---------- o'quvchi (telefon) ---------- */
body.player{overflow:auto}
#player{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;padding:18px 16px 24px}
.ph{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--gold)}
.ph .me{color:var(--ink);font-family:var(--sans);font-weight:700;font-size:14px;letter-spacing:0}
.pbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0}
.pcard{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center}
.pcard h2{font-size:24px;font-weight:800;line-height:1.2}
.pcard p{color:var(--mut);margin-top:8px;font-size:15px;line-height:1.45}
.pin{width:100%;font-size:20px;padding:14px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:#fff;margin-top:16px;text-align:center;font-family:inherit}
.pgo{width:100%;margin-top:14px;font-size:19px;padding:15px;border-radius:12px}
.gbadge{display:inline-block;padding:8px 16px;border-radius:999px;font-weight:800;font-size:18px;margin-top:12px;color:#fff}
.pq{font-size:18px;font-weight:700;line-height:1.35;margin-bottom:16px}
.pans{display:grid;gap:10px}
.pans button{border-radius:14px;padding:18px 14px;font-size:17px;font-weight:700;color:#fff;text-align:left;display:flex;gap:12px;align-items:center;min-height:64px}
.pans button .sh{font-size:20px;width:24px;text-align:center;flex:none}
.pans button.A{background:var(--A)} .pans button.B{background:var(--B)} .pans button.C{background:var(--C)} .pans button.D{background:var(--D)}
.pans button.sel{outline:4px solid #fff}
.pans.locked button{filter:blur(4px) brightness(.6);pointer-events:none}
.plist{display:grid;gap:8px}
.plist button{background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px;font-size:16px;text-align:left;display:flex;gap:10px;align-items:center}
.plist button.sel{background:var(--gc,#3d8bff);border-color:#fff}
.plist button.dis{opacity:.35;pointer-events:none}
.big-emoji{font-size:64px}
.ok{color:var(--teal)} .no{color:var(--red)}
.pts{font-size:40px;font-weight:800;font-family:var(--mono)}
.pfoot{text-align:center;font-family:var(--mono);font-size:12px;color:var(--mut);margin-top:10px}
#slide.noanim .a{animation:none;opacity:1;transform:none}
.answers.reveal .ans.right{transform:scale(1.03)!important}
/* --- kattaroq va markazlashgan joylashuv --- */
.sl{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-bottom:4vh}
.kick{font-size:1.9vh}
h1.t{font-size:6.6vh}
.sub{font-size:2.7vh}
.cards{gap:1.8vw;margin-top:3.6vh}
.card{padding:3vh 1.8vw}
.card h3{font-size:3.1vh} .card p{font-size:2.4vh} .card .num{font-size:5.6vh} .card .ic{font-size:4.4vh} .card .tag{font-size:1.6vh}
.take{font-size:2.8vh;margin-top:3.4vh;padding:2.2vh 1.6vw}
.tl{margin-top:7vh} .tl:before{top:5vh}
.tl .y{font-size:4vh} .tl .tt{font-size:2.6vh} .tl .ts{font-size:2.1vh}
.flow .st{padding:3.4vh 1vw} .flow .st .ic{font-size:6.4vh} .flow .st h3{font-size:3.2vh} .flow .st p{font-size:2.2vh}
.stat{padding:5vh 1.4vw} .stat .v{font-size:9.5vh} .stat .l{font-size:2.7vh}
.chip{font-size:2.5vh;padding:1.2vh 1.6vw}
.qhead h1{font-size:5vh}
.acount{font-size:2.6vh}
.ans{font-size:3vh;min-height:14vh;padding:3vh 1.6vw}
.answers{gap:1.4vw;margin-top:5vh}
.timer{width:15vh;height:15vh;font-size:6vh}
.cty{min-height:21vh;padding:2.2vh 1vw} .cty .fl{font-size:5.4vh} .cty h4{font-size:2.8vh} .cty .yy{font-size:1.9vh} .cty .sit{font-size:1.8vh}
.cty .votes i{width:1.6vh;height:1.6vh}
.grp h3{font-size:3.8vh} .grp .cc{font-size:3vh} .grp .op{font-size:2.15vh} .grp .n{font-size:2vh} .grp .mm span{font-size:2vh}
.verdict{font-size:5vh} .fact{font-size:2.6vh;margin-top:2.4vh}
.gdpbox .v{font-size:9vh} .alt{font-size:2.2vh}
.gbar .nm{font-size:3.2vh;width:11vw} .gbar .tr{height:7.5vh} .top5 li{font-size:2.8vh}
/* yumshoq slayd o'tishi */
#slide > .sl{animation:slin .75s cubic-bezier(.2,.8,.2,1)}
#slide.noanim > .sl{animation:none}
@keyframes slin{from{opacity:0;transform:translateX(3vw) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
/* Esda tuting */
.key{margin-top:2.6vh;background:linear-gradient(90deg,rgba(247,201,72,.16),rgba(247,201,72,.04));border:1px solid rgba(247,201,72,.45);border-radius:14px;padding:1.8vh 1.6vw;display:flex;gap:1.2vw;align-items:center;font-size:2.6vh;font-weight:700;line-height:1.35}

.card p+p{margin-top:.5vh}
/* intro qo'shimchalari */
#intro #ecg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#intro #iscene{position:absolute;inset:0;z-index:2}
#intro .scene.out{animation:fout .75s forwards}
#intro .irow{display:flex;align-items:center;gap:5vw;text-align:left}
#intro .artw{flex:none} #intro .art{width:32vw;height:auto;filter:drop-shadow(0 0 12px rgba(247,201,72,.45))}
#intro .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#intro .itxt .tx{margin-top:2vh;max-width:40vw}
#intro .itxt .yr{text-align:left}
#intro .tx b{color:#f7c948}
#intro .chain{display:flex;align-items:center;gap:1.2vw;flex-wrap:wrap;justify-content:center}
#intro .cb{background:rgba(255,255,255,.08);border:1px solid rgba(247,201,72,.5);border-radius:14px;padding:1.6vh 1.4vw;font-size:2.8vh;font-weight:700;color:#fff;opacity:0;animation:popin .6s forwards}
#intro .ca{color:#f7c948;font-size:3.4vh;opacity:0;animation:fin .5s forwards}
@keyframes popin{from{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}to{opacity:1;transform:none}}
#intro .chart{width:46vw;margin-top:4vh;filter:drop-shadow(0 0 10px rgba(62,230,196,.5))}
#intro .chart .dr{animation-duration:3s;animation-delay:.8s}
#intro .bars{z-index:3} #intro .skip{z-index:5} #intro .flash{z-index:4}
#intro .bars:before,#intro .bars:after{z-index:3}
#intro .money{font-size:9vh;white-space:nowrap}
/* musiqa tanlash va intro pauzasi */
#lobby .mpick{position:absolute;left:2vw;bottom:6vh;font-size:1.6vh;line-height:2.6}
#lobby .mpick label{display:inline-flex;align-items:center;height:auto;padding:.6vh .9vw;font-size:1.5vh;cursor:pointer}
#lobby .mnm{margin-left:.8vw;color:var(--mut);font-family:var(--mono);font-size:1.4vh}
#intro .ictl{position:absolute;right:2vw;bottom:2vh;display:flex;gap:.6vw;z-index:6}
#intro .ictl .skip{position:static}
#intro.paused *, #intro.paused *:before, #intro.paused *:after{animation-play-state:paused!important}
#intro .pbig{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:16vh;color:rgba(255,255,255,.75);z-index:5;pointer-events:none;text-shadow:0 0 40px #000}
#intro.paused .pbig{display:flex}
#lobby .mpick{top:7vh;bottom:auto}
/* QR ekranidagi va telefondagi EKG */
#lobby .lecg{position:absolute;left:0;top:50%;width:100%;height:24vh;transform:translateY(-62%);z-index:0;opacity:.9;pointer-events:none}

#lobby .snd{position:absolute;top:2vh;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:1.6vh;color:#ffb3c1;letter-spacing:.08em;animation:pulse 1s infinite alternate}
.pecg{width:100%;height:90px;display:block;margin:10px 0 4px}
#player .hbeat{animation:hb 1s infinite}

      <div class="sub a" style="--d:7;font-size:2.4vh;margin-top:3vh">Taqdimotchi: <b style="color:#fff">${PRESENTER}</b></div></div>` }
];

const TOTAL = S.length;

/* ===================================================================
   HOST (proyektor ekrani)
   =================================================================== */
function host() {
  document.body.classList.add("host");
  startNet(false);
  let room = P.get("room");
  if (!room) { room = "1122"; history.replaceState(null, "", `?host=1&room=${room}${LOCAL && P.get("local") ? "&local=1" : ""}`); }
  const R = "rooms/" + room;
  const base = location.origin + location.pathname.replace(/index\.html$/, "");
  const joinUrl = `${base}?room=${room}${P.get("local") === "1" ? "&local=1" : ""}`;
  const QR = qrSvg(joinUrl);

  let st = { slide: -1, phase: "show" };
  let players = {}, scores = {}, game = {}, results = {}, live = {}, unLive = null;
  let lastKey = "", tickSec = -1, autoT = null, closing = false, needs = false;

  const app = $("#app");
  app.innerHTML = `
    <div id="lobby">
      <canvas id="lecg" class="lecg"></canvas>
      <div class="bigqr">${QR}</div>
      <div class="snd" id="lsnd">🔊 Yurak urishi ovozi uchun ekranga bir marta bosing</div>
      <h2>Skanerlang va qo‘shiling · <span>XONA ${room}</span></h2>
      <div class="url">${esc(joinUrl)}</div>
      <div class="names" id="lnames"></div>
      <div class="pl" id="lcount">0 ISHTIROKCHI</div>
      <button class="cbtn" id="lreset" style="position:absolute;left:2vw;top:2vh">↺ Xonani tozalash</button>
      <button class="cbtn hidden" id="lresume" style="position:absolute;right:2vw;bottom:9vh"></button>
      <div class="mpick"><div class="kick" style="margin:0 0 .8vh">🎵 INTRO MUSIQASI (shu kompyuterdan)</div>
        <label class="cbtn">1-musiqa · yaralish (sokin)<input type="file" id="m1in" accept="audio/*" hidden></label><span id="m1name" class="mnm">tanlanmagan</span><br>
        <label class="cbtn">2-musiqa · rivojlanish (shovqinli)<input type="file" id="m2in" accept="audio/*" hidden></label><span id="m2name" class="mnm">tanlanmagan</span></div>
      <button class="pbtn go" id="lgo">▶ INTRONI BOSHLASH</button>
    </div>
    <div id="stage" class="hidden">
      <div class="topbar"><div>${HEADER}</div><div class="r"><span id="sno">01 / ${TOTAL}</span> · <span class="live">● JONLI</span></div></div>
      <div id="slide"></div>
      <div class="bottombar">
        <div class="joinbox"><div class="qr">${QR}</div><div>XONA · <b>${room}</b><br><span id="pc">0 ishtirokchi</span></div></div>
        <div class="ctrls">
          <button class="cbtn" id="bhome" title="Boshiga — QR va intro">⏮ Boshiga</button>
          <button class="cbtn" id="bprev" title="Orqaga">◀</button>
          <button class="pbtn" id="bnext">Keyingi ▶</button>
          <button class="cbtn" id="bmute" title="Ovoz">🔊</button>
          <button class="cbtn" id="bfs" title="To‘liq ekran">⛶</button>
        </div>
      </div>
    </div>`;

  $("#lgo").onclick = () => { ac(); mac(); startIntro(); };
  $("#lresume").onclick = () => { ac(); if (saved >= 0) go(saved); };
  $("#lreset").onclick = async () => { if (!$("#lreset").dataset.ok) { $("#lreset").dataset.ok = 1; $("#lreset").textContent = "Rostdan tozalaysizmi? Yana bosing"; return; }
    await DB.set(R, null); location.reload(); };
  $("#stage").addEventListener("dblclick", e => { if (e.target.closest(".topbar")) { st = { slide: -1, phase: "show" }; write(); lastKey = ""; render(true); } });
  $("#bnext").onclick = () => next();
  $("#bprev").onclick = () => prev();
  $("#bhome").onclick = () => { const b = $("#bhome"); if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = "Rostdanmi? Yana bosing"; setTimeout(() => { b.dataset.ok = ""; b.textContent = "⏮ Boshiga"; }, 3000); return; }
    b.dataset.ok = ""; b.textContent = "⏮ Boshiga"; saved = st.slide; const rb = $("#lresume"); if (saved > 0) { rb.classList.remove("hidden"); rb.textContent = `⏭ ${saved + 1}-slayddan davom ettirish`; }
    st = { slide: -1, phase: "show" }; write(); lastKey = ""; render(true); };
  $("#bmute").onclick = () => { setMuted(!muted); $("#bmute").textContent = muted ? "🔇" : "🔊"; };
  $("#bfs").onclick = fs;
  document.addEventListener("keydown", e => {
    if ($("#intro")) { if (e.key === "Escape" || e.key === "ArrowRight") endIntro(); else if (e.key === " " || e.key === "p" || e.key === "P") { e.preventDefault(); togglePause(); } return; }
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown" || e.key === "Enter") { e.preventDefault(); if (st.slide < 0) { ac(); startIntro(); } else next(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") prev();
    else if (e.key === "f" || e.key === "F") fs();
    else if (e.key === "m" || e.key === "M") $("#bmute").click();
  });
  document.addEventListener("pointerdown", () => { ac(); const h = $("#lsnd"); if (h) h.remove(); }, { once: true });
  function fs() { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) { } }

  // --- obunalar ---
  let pcount = -1;
  DB.on(R + "/players", v => { players = v || {}; assignGroups(); const n = plist().length; if (pcount >= 0 && n > pcount && st.slide < 0 && !$("#intro")) heartBeat(1.3); pcount = n; onLive(); });
  DB.on(R + "/scores", v => { scores = v || {}; onLive(); });
  DB.on(R + "/game", v => { game = v || {}; if (needs) render(true); else onLive(); });
  DB.on(R + "/results", v => { results = v || {}; if (needs) render(true); });
  // Sahifa har ochilganda QR va intro (lobbi) bilan boshlanadi; oldingi joy saqlanadi
  let saved = -1;
  DB.get(R + "/state").then(v => {
    if (v && typeof v.slide === "number" && v.slide > 0) { saved = v.slide; const rb = $("#lresume"); rb.classList.remove("hidden"); rb.textContent = `⏭ ${v.slide + 1}-slayddan davom ettirish`; }
    st = { slide: -1, phase: "show" }; write(); render(true); });

  function write() { DB.set(R + "/state", st); }
  function setState(ns) { st = Object.assign({}, ns); write(); render(); }

  function assignGroups() {
    const cnt = [0, 0, 0]; for (const id in players) if (players[id].group != null) cnt[players[id].group]++;
    for (const id in players) if (players[id].group == null && players[id].name) {
      const m = Math.min(...cnt); const c = [0, 1, 2].filter(g => cnt[g] === m); const g = c[Math.floor(Math.random() * c.length)];
      cnt[g]++; players[id].group = g; DB.set(`${R}/players/${id}/group`, g);
    }
  }
  const plist = () => Object.entries(players).filter(([, p]) => p && p.name).map(([id, p]) => Object.assign({ id }, p));
  const groupMembers = g => plist().filter(p => p.group === g);

  function initialPhase(s) { return { quiz: "read", vote: "read", reveal: "warp", results: "board" }[s.type] || "show"; }
  function go(i) {
    if (i < 0) i = 0; if (i >= TOTAL) i = TOTAL - 1;
    const sq = S[i]; if (sq.type === "quiz") { delete results[sq.qid]; DB.update(R, { ["answers/" + sq.qid]: null, ["results/" + sq.qid]: null }); }
    setState({ slide: i, phase: initialPhase(S[i]), qStart: 0, dur: 0 });
  }
  function prev() { if (Date.now() - lastNav < 500) return; lastNav = Date.now(); if (st.slide > 0) go(st.slide - 1); }
  let lastNav = 0;
  async function next() {
    if (closing) return;
    if (Date.now() - lastNav < 900) return; lastNav = Date.now();
    const s = S[st.slide]; if (!s) return;
    if (s.type === "quiz") {
      if (st.phase === "read") { sfx("pop"); setState({ slide: st.slide, phase: "open", qStart: now(), dur: QUIZ[s.qid].dur }); }
      else if (st.phase === "open") await closeQuiz();
      else go(st.slide + 1);
    } else if (s.type === "vote") {
      if (st.phase === "read") { sfx("pop"); setState({ slide: st.slide, phase: "open", qStart: now(), dur: 45 }); }
      else if (st.phase === "open") await closeVote();
      else go(st.slide + 1);
    } else if (s.type === "reveal") {
      if (st.phase === "warp") setState(Object.assign({}, st, { phase: "show" })); else go(st.slide + 1);
    } else if (s.type === "results") {
      if (st.phase === "board") setState(Object.assign({}, st, { phase: "drum" }));
      else if (st.phase === "drum") setState(Object.assign({}, st, { phase: "win" }));
      else go(st.slide + 1);
    } else if (st.slide < TOTAL - 1) go(st.slide + 1);
  }

  async function closeQuiz() {
    closing = true; const s = S[st.slide]; const q = QUIZ[s.qid];
    try {
      // Har safar javoblardan qayta hisoblanadi (test qayta o'tkazilsa ham to'g'ri ishlaydi)
      const ans = (await DB.get(`${R}/answers/${s.qid}`)) || {}; const counts = [0, 0, 0, 0]; const pts = {};
      for (const pid in ans) {
        const a = ans[pid]; if (a == null || a.a == null) continue; const ai = Number(a.a); if (!(ai >= 0 && ai < 4)) continue; counts[ai]++;
        if (ai === q.c) { const el = Math.max(0, ((Number(a.t) || st.qStart) - st.qStart) / 1000); pts[pid] = Math.round(1000 - 500 * Math.min(1, el / q.dur)); }
        else pts[pid] = 0;
      }
      const all = (await DB.get(`${R}/results`)) || {}; all[s.qid] = { counts, c: q.c, pts }; results = all;
      const totals = {}; for (const qid in all) { const p = (all[qid] && all[qid].pts) || {}; for (const pid in p) totals[pid] = (totals[pid] || 0) + (Number(p[pid]) || 0); }
      st = Object.assign({}, st, { phase: "reveal" });
      await DB.update(R, { ["results/" + s.qid]: all[s.qid], scores: totals, state: st }); sfx("ok"); render();
    } finally { closing = false; }
  }

  async function closeVote() {
    closing = true; const s = S[st.slide];
    try {
      const v = (await DB.get(`${R}/votes/${s.vote}`)) || {}; const upd = {};
      if (s.vote === "country") {
        const tal = [{}, {}, {}];
        for (const pid in v) { const p = players[pid]; if (!p || p.group == null) continue; tal[p.group][v[pid]] = (tal[p.group][v[pid]] || 0) + 1; }
        const taken = new Set(), pick = {};
        const order = [0, 1, 2].sort((a, b) => Object.values(tal[b]).reduce((x, y) => x + y, 0) - Object.values(tal[a]).reduce((x, y) => x + y, 0));
        for (const g of order) {
          const cand = Object.keys(tal[g]).map(Number).sort((a, b) => (tal[g][b] - tal[g][a]) || (Math.random() - .5));
          let c = cand.find(x => !taken.has(x));
          if (c == null) { const free = COUNTRIES.map((_, i) => i).filter(i => !taken.has(i)); c = free[Math.floor(Math.random() * free.length)]; }
          taken.add(c); pick[g] = c;
        }
        upd["game/country"] = pick;
      } else {
        const tal = [{}, {}, {}];
        for (const pid in v) { const p = players[pid]; if (!p || p.group == null) continue; tal[p.group][v[pid]] = (tal[p.group][v[pid]] || 0) + 1; }
        const ch = {}, bonus = {};
        for (const g of [0, 1, 2]) {
          const cand = Object.keys(tal[g]).map(Number).sort((a, b) => (tal[g][b] - tal[g][a]) || (Math.random() - .5));
          ch[g] = cand.length ? cand[0] : Math.floor(Math.random() * 4);
          const ci = (game.country || {})[g]; const cs = ci != null ? CASES[COUNTRIES[ci].opts[ch[g]][1]] : null;
          bonus[g] = cs && cs.good ? GAME_BONUS : 0;
        }
        upd["game/choice"] = ch; upd["game/bonus"] = bonus;
      }
      st = Object.assign({}, st, { phase: "done" }); upd.state = st;
      await DB.update(R, upd); sfx("ok"); render();
    } finally { closing = false; }
  }

  // --- taymer ---
  setInterval(() => {
    const s = S[st.slide]; const el = $("#timer");
    if (!s || st.phase !== "open" || !(s.type === "quiz" || s.type === "vote")) { tickSec = -1; return; }
    const rem = Math.max(0, st.dur - (now() - st.qStart) / 1000); const sec = Math.ceil(rem);
    if (el) { el.textContent = sec; el.classList.toggle("low", sec <= 5); }
    if (sec !== tickSec) { tickSec = sec; if (sec <= 5 && sec > 0) sfx("beep", false); else if (sec > 0) sfx("tick"); }
    if (rem <= 0 && !closing) { if (s.type === "quiz") closeQuiz(); else closeVote(); }
    if (s.type === "quiz" && !closing) { const n = plist().length; if (n > 0 && (live.answered || 0) >= n && rem < st.dur - 1.5) closeQuiz(); }
  }, 200);

  // --- slaydga xos jonli obunalar ---
  function subLive() {
    if (unLive) { unLive(); unLive = null; } live = {};
    const s = S[st.slide]; if (!s) return;
    if (s.type === "quiz") unLive = DB.on(`${R}/answers/${s.qid}`, v => { live.answers = v || {}; live.answered = Object.keys(live.answers).length; onLive(); });
    if (s.type === "vote") unLive = DB.on(`${R}/votes/${s.vote}`, v => { live.votes = v || {}; onLive(); });
  }

  function groupScores() {
    return GROUPS.map((g, i) => { const m = groupMembers(i); const sum = m.reduce((a, p) => a + (scores[p.id] || 0), 0); const avg = m.length ? Math.round(sum / m.length) : 0; const b = (game.bonus || {})[i] || 0; return { i, name: g.name, color: g.color, members: m.length, avg, bonus: b, total: avg + b }; });
  }

  // --- chizish ---
  function render(force) {
    const key = st.slide + "|" + st.phase;
    if (st.slide < 0) { $("#lobby").classList.remove("hidden"); $("#stage").classList.add("hidden"); if (!$("#intro")) { ecgRun("lecg"); heartStart(1000); } onLive(); return; }
    heartStop(); ecgStop();
    $("#lobby").classList.add("hidden"); $("#stage").classList.remove("hidden");
    const s = S[st.slide]; const sameSlide = lastKey.split("|")[0] === String(st.slide);
    if (key === lastKey && !force) { onLive(); return; }
    if (!sameSlide) { subLive(); music("bgm", false); }
    lastKey = key; clearTimeout(autoT);
    $("#sno").textContent = String(st.slide + 1).padStart(2, "0") + " / " + TOTAL;
    const el = $("#slide"); el.className = sameSlide && !force ? "noanim" : ""; needs = false;
    el.innerHTML = `<div class="sl">${renderSlide(s)}</div>`;
    $("#bnext").innerHTML = primaryLabel(s);
    afterRender(s, el, sameSlide);
    onLive();
  }

  function primaryLabel(s) {
    if (s.type === "quiz") return { read: "🔓 BOSHLASH", open: "Javobni ko‘rsatish ▶", reveal: "Keyingi ▶" }[st.phase] || "Keyingi ▶";
    if (s.type === "vote") return { read: "🔓 Ovoz berishni boshlash", open: "Ovozni yakunlash ▶", done: "Keyingi ▶" }[st.phase];
    if (s.type === "reveal") return st.phase === "warp" ? "Natijani ko‘rsatish ▶" : "Keyingi ▶";
    if (s.type === "results") return { board: "🥁 G‘olibni e’lon qilish", drum: "…", win: "Yakunlash ▶" }[st.phase];
    if (s.thanks) return "✓";
    if (st.slide === 0) return "Boshlaymiz ▶";
    return "Keyingi ▶";
  }

  function renderSlide(s) {
    if (s.type === "content") return s.render();
    if (s.type === "quiz") return renderQuiz(s);
    if (s.type === "gameintro") return `
      ${K("JONLI O‘YIN · INSTITUTLAR LABORATORIYASI")}
      ${T("Siz — <em>hukumatsiz</em>. Qaysi qoidani tanlaysiz?")}
      ${SUB("Har bir guruh bitta davlatni tanlaydi va unga iqtisodiy institut joriy qiladi. Keyin tarix natijani haqiqiy raqamlarda ko‘rsatadi.")}
      <div class="groups" id="glive"></div>
      ${TAKE("Inkluziv yo‘lni tanlagan guruhga <span>+1500 ball</span>. Variantlarda maslahat yo‘q — ehtiyot bo‘ling!", 6)}`;
    if (s.type === "vote" && s.vote === "country") return `
      <div class="qhead"><div>${K("1-BOSQICH · DAVLAT TANLANG")}${T("Guruhingiz bilan <em>bitta davlatni</em> tanlang")}
        <div class="acount a" style="--d:2">${st.phase === "read" ? "Guruhingiz bilan maslahatlashing — ovoz berish tez orada ochiladi" : st.phase === "open" ? "📱 Telefoningizda ovoz bering · bitta davlatni ikki guruh ololmaydi" : "Davlatlar taqsimlandi!"}</div></div>
        ${st.phase === "open" ? `<div class="timer" id="timer">${st.dur}</div>` : ""}</div>
      <div class="ggrid">${COUNTRIES.map((c, i) => `<div class="cty a" id="ct${i}" style="--d:${2 + i * .4}"><div class="fl">${c.flag}</div><h4>${c.name}</h4><div class="yy">${c.year}-YIL</div><div class="sit">${c.sit}</div><div class="votes" id="cv${i}"></div><div class="who" id="cw${i}"></div></div>`).join("")}</div>`;
    if (s.type === "vote" && s.vote === "inst") {
      const gc = game.country || {}; if (gc[0] == null) needs = true;
      return `<div class="qhead"><div>${K("2-BOSQICH · INSTITUT TANLANG")}${T("Davlatingizga qaysi <em>qoidani</em> joriy qilasiz?")}
        <div class="acount a" style="--d:2">${st.phase === "read" ? "Variantlarni o‘qing va guruhingiz bilan maslahatlashing" : st.phase === "open" ? "📱 Telefoningizda ovoz bering" : "Tanlovlar qabul qilindi. Endi tarix gapiradi…"}</div></div>
        ${st.phase === "open" ? `<div class="timer" id="timer">${st.dur}</div>` : ""}</div>
      <div class="groups">${GROUPS.map((g, i) => { const c = COUNTRIES[gc[i]]; return `<div class="grp a" style="--d:${3 + i};--gc:${g.color}"><h3>${g.emoji} ${g.name}</h3>
        ${c ? `<div class="cc">${c.flag} ${c.name}, ${c.year}</div><div class="n">${c.sit}</div>${c.opts.map((o, k) => `<div class="op"><b style="color:var(--gold)">${LETTERS[k]})</b> ${o[0]}</div>`).join("")}` : `<div class="n">Davlat tanlanmagan</div>`}
        <div class="n" id="iv${i}" style="margin-top:1.4vh"></div></div>`; }).join("")}</div>`;
    }
    if (s.type === "reveal") return renderReveal(s);
    if (s.type === "results") return renderResults();
    return "";
  }

  function renderQuiz(s) {
    const q = QUIZ[s.qid]; const r = results[s.qid]; const rev = st.phase === "reveal"; const locked = st.phase === "read"; if (rev && !r) needs = true;
    const total = r ? r.counts.reduce((a, b) => a + b, 0) || 1 : 1;
    return `<div class="qhead"><div>${K(`TEST ${q.n}/10 · TELEFONDA JAVOB BERING!`)}<h1 class="a" style="--d:1">${q.q}</h1>
        <div class="acount a" style="--d:2"><b id="acnt">0</b> / <span id="pcnt">0</span> javob berdi</div></div>
        <div class="timer a" id="timer" style="--d:1">${rev ? "✓" : q.dur}</div></div>
      <div class="answers ${locked ? "locked" : ""} ${rev ? "reveal" : ""}">
        ${q.a.map((t, i) => `<div class="ans ${LETTERS[i]} ${rev ? (i === q.c ? "right" : "wrong") : ""} a" style="--d:${3 + i * .6}"><span class="sh">${SHAPES[i]}</span><span>${t}</span>${rev && r ? `<span class="cnt">${r.counts[i]}</span><span class="bar" style="width:${100 * r.counts[i] / total}%"></span>` : ""}</div>`).join("")}
        ${locked ? `<div class="lock"><div class="pad">🔒</div><h2>Savolni o‘qing</h2><p>Telefonlar «BOSHLASH» bosilgach ochiladi</p></div>` : ""}
      </div>`;
  }

  function revealData(g) {
    const ci = (game.country || {})[g], oi = (game.choice || {})[g];
    if (ci == null || oi == null) return null;
    const c = COUNTRIES[ci], opt = c.opts[oi], cs = CASES[opt[1]];
    const goodOpt = c.opts.find(o => CASES[o[1]].good); const badOpts = c.opts.filter(o => !CASES[o[1]].good);
    return { c, opt, cs, good: CASES[goodOpt[1]], bad: CASES[badOpts[0][1]] };
  }
  function renderReveal(s) {
    const g = GROUPS[s.g], d = revealData(s.g);
    if (!d) { needs = true; return `<div class="center">${K(g.name.toUpperCase() + " GURUH")}<div class="big a" style="--d:1">Ma’lumot yo‘q</div><div class="sub">Avval davlat va institut tanlang</div></div>`; }
    if (st.phase === "warp") return `<div class="warp">
        <div class="kick a" style="color:${g.color}">${g.emoji} ${g.name.toUpperCase()} GURUH · ${d.c.flag} ${d.c.name.toUpperCase()}</div>
        <div class="sub a" style="--d:1;color:#fff;font-size:2.8vh;max-width:70vw;text-align:center">Tanlangan qoida: «${d.opt[0]}»</div>
        <div class="yc" id="yc">${d.c.year}</div><div class="wl">YILLAR O‘TMOQDA…</div></div>`;
    const cs = d.cs;
    return `${K(`${g.emoji} ${g.name.toUpperCase()} GURUH · ${d.c.flag} ${d.c.name.toUpperCase()} · ${d.c.year} → BUGUN`)}
      <div class="verdict ${cs.good ? "good" : "bad"} a" style="--d:1">${cs.good ? "📈 Mamlakat gullab-yashnadi!" : "📉 Mamlakat inqirozga yuz tutdi"}</div>
      <div class="sub a" style="--d:2">Bu yo‘lni haqiqatda <b style="color:#fff">${cs.name}</b> tanlagan edi</div>
      <div class="res"><div>${cs.facts.map((f, i) => `<div class="fact a" style="--d:${3 + i}"><b>0${i + 1}</b><span>${f}</span></div>`).join("")}</div>

  async function idbPut(k, v) { try { const d = await idb(); d.transaction("f", "readwrite").objectStore("f").put(v, k); } catch (e) { } }
  async function idbGet(k) { try { const d = await idb(); return await new Promise(r => { const q = d.transaction("f").objectStore("f").get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch (e) { return null; } }
  function setMus(k, file) { if (!file) return; if (MUS[k]) URL.revokeObjectURL(MUS[k].url); MUS[k] = { url: URL.createObjectURL(file), name: file.name || "musiqa", blob: file }; const l = $("#" + k + "name"); if (l) l.textContent = "✓ " + MUS[k].name; }

  const at = (ms, fn) => ievents.push({ t: iclock + ms, fn });
  function iloop(now) { if (!ipaused) { iclock += Math.min(100, now - ilast); const due = ievents.filter(e => e.t <= iclock); ievents = ievents.filter(e => e.t > iclock); due.forEach(e => { try { e.fn(); } catch (x) { } }); } ilast = now; iraf = requestAnimationFrame(iloop); }
  // Musiqa Web Audio orqali: qo'shiq aylanib (loop) chalinadi, filtr bilan «sokin» → «shovqinli» qilinadi
  let MAC = null; const trk = { cur: null };
  function mac() { if (!MAC) MAC = new (window.AudioContext || window.webkitAudioContext)(); if (MAC.state === "suspended" && !ipaused) MAC.resume(); return MAC; }
  async function startTrack(k, opts) {
    const m = MUS[k]; if (!m || !m.blob) return null; const c = mac();
    if (!m.buf) { try { m.buf = await c.decodeAudioData(await m.blob.arrayBuffer()); } catch (e) { return null; } }
    const src = c.createBufferSource(); src.buffer = m.buf; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = opts.freq; lp.Q.value = 0.7;
    const g = c.createGain(); g.gain.value = 0.0001; src.connect(lp).connect(g).connect(c.destination);
    const t = c.currentTime; src.start(t); g.gain.exponentialRampToValueAtTime(Math.max(0.0001, (muted ? 0.0001 : opts.vol)), t + (opts.fadeIn || 1.5));
    return { src, lp, g };
  }
  function trackTo(tr, vol, freq, sec) { if (!tr) return; const c = mac(), t = c.currentTime;
    tr.g.gain.cancelScheduledValues(t); tr.g.gain.setValueAtTime(Math.max(0.0001, tr.g.gain.value), t); tr.g.gain.exponentialRampToValueAtTime(Math.max(0.0001, muted ? 0.0001 : vol), t + sec);
    if (freq) { tr.lp.frequency.cancelScheduledValues(t); tr.lp.frequency.setValueAtTime(tr.lp.frequency.value, t); tr.lp.frequency.exponentialRampToValueAtTime(freq, t + sec); } }
  function trackStop(tr, sec) { if (!tr) return; trackTo(tr, 0.0001, null, sec || 1.5); try { tr.src.stop(mac().currentTime + (sec || 1.5) + 0.1); } catch (e) { } }
  function togglePause() {

    // 1-QISM: yaralish — sokin musiqa (1-musiqa)
    let usedM1 = false;
    at(0, () => { usedM1 = !!MUS.m1; if (usedM1) startTrack("m1", { vol: 0.5, freq: 900, fadeIn: 2 }).then(t => { trk.a = t; }); else sfx("swell");

      else sfx("swell");
      const ch = ["🎓 Universitet", "🔬 Tadqiqot", "🚀 Startap", "💸 Investitsiya", "🛒 Bozor"];

      ch.forEach((_, i) => at(750 + 1600 + i * 750, () => sfx("pop"))); });
    at(27200, () => { if (!trk.b) sfx("riser", 3.6);
      sc(`<div class="l2" style="font-size:2.8vh;color:#ddd;animation-delay:0s">Bugun ular bilan bog‘liq kompaniyalarning yillik daromadi:</div>
        <div style="display:flex;gap:8vw;margin-top:4vh"><div><div class="money" id="m1">0</div><div class="ml">MIT bitiruvchilari kompaniyalari</div></div><div><div class="money" id="m2" style="color:#f7c948">0</div><div class="ml">Stanfordga bog‘liq kompaniyalar</div></div></div>

    const g = me && me.group != null ? GROUPS[me.group] : null;
    return `<div id="player"><div class="ph"><div>XONA ${esc(room)}</div><div class="me">${me && me.name ? esc(me.name) : ""} ${g ? `<span style="color:${g.color}">● ${g.name}</span>` : ""}</div></div>
      <div class="pbody">${body}</div><div class="pfoot">${me && me.name ? `Ballingiz: <b style="color:var(--gold)">${scores[pid] || 0}</b> · ` : ""}TIIAME · INSTITUTSIONAL IQTISODIYOT</div></div>`;
  }
  const wait = (emoji, h, p) => `<div class="pcard"><div class="big-emoji">${emoji}</div><h2>${h}</h2>${p ? `<p>${p}</p>` : ""}</div>`;

  function draw() {
    if (!me || !me.name) {
      if ($("#nin")) return;
      app.innerHTML = frame(`<div class="pcard"><div class="big-emoji">👋</div><h2>Xush kelibsiz!</h2><p>Ismingizni kiriting — u ekranda ko‘rinadi</p>
        <input class="pin" id="nin" maxlength="20" placeholder="Ismingiz"><button class="pbtn pgo" id="ngo">Qo‘shilish ▶</button></div>`);
      const go = () => { const n = $("#nin").value.trim().slice(0, 20); if (!n) return; ac(); $("#ngo").disabled = true; DB.set(`${R}/players/${pid}`, { name: n, j: TS() }); };
      $("#ngo").onclick = go; $("#nin").onkeydown = e => { if (e.key === "Enter") go(); };
      return;
    }
    const key = JSON.stringify([st, me, myVotes, res && st && S[st.slide] && res[S[st.slide].qid], game, scores[pid]]);
    if (key === lastKey) return; lastKey = key;
    const g = me.group != null ? GROUPS[me.group] : null;
    if (!st || st.slide < 0) {
      const on = AC && AC.state === "running";
      app.innerHTML = frame(`<div class="pcard"><div class="big-emoji hbeat">❤️</div><h2>Siz qo‘shildingiz!</h2><canvas id="pecg" class="pecg"></canvas>
        <p>${g ? `Guruhingiz: <br><span class="gbadge" style="background:${g.color}">${g.emoji} ${g.name}</span><br><br>` : "Guruh belgilanmoqda…<br><br>"}Taqdimot boshlanishini kuting</p>
        ${on ? "" : `<button class="pbtn pgo" id="hon">🔊 Yurak urishini yoqish</button>`}</div>`);
      const hb = $("#hon"); if (hb) hb.onclick = () => { ac(); lastKey = ""; setTimeout(draw, 50); };
      ecgRun("pecg"); heartStart(1000, true); return; }
    heartStop(); ecgStop();
    const s = S[st.slide];
    if (s.type === "quiz") return drawQuiz(s);
    if (s.type === "vote") return drawVote(s, g);
    if (s.type === "reveal") { const mine = me.group === s.g; app.innerHTML = frame(wait(mine ? "⏳" : "👀", mine ? "Sizning guruhingiz natijasi!" : `${GROUPS[s.g].name} guruh natijasi`, "Ekranga qarang")); return; }
    if (s.type === "results") {
      const arr = Object.entries(scores).sort((a, b) => b[1] - a[1]); const rank = arr.findIndex(x => x[0] === pid) + 1;
      app.innerHTML = frame(wait(st.phase === "win" ? "🎉" : "🏆", st.phase === "win" ? "Natijalar e’lon qilindi!" : "Natijalar ekranda", `Sizning o‘rningiz: <b style="color:#fff">${rank || "—"}</b> / ${Object.keys(players).length}<br>Ballingiz: <b style="color:var(--gold)">${scores[pid] || 0}</b>`));
      if (st.phase === "win") confetti(120); return;
    }
    if (s.thanks) { app.innerHTML = frame(wait("🙏", "E’tiboringiz uchun rahmat!", `Jami ballingiz: <b style="color:var(--gold)">${scores[pid] || 0}</b>`)); return; }
    if (s.type === "gameintro") { app.innerHTML = frame(wait("🧪", "Institutlar laboratoriyasi", g ? `Siz <span class="gbadge" style="background:${g.color}">${g.emoji} ${g.name}</span> guruhidasiz.<br><br>Guruhdoshlaringizni toping!` : "")); return; }
    app.innerHTML = frame(wait("👀", "Ekranga qarang", "Keyingi savol tez orada telefoningizda chiqadi"));
  }

  function drawQuiz(s) {
    const q = QUIZ[s.qid]; const r = res[s.qid];
    if (st.phase === "read") delete myAns[s.qid];
    if (st.phase === "reveal") {
      const a = myAns[s.qid] != null ? myAns[s.qid] : myDbAns[s.qid];
      const p = r && r.pts && r.pts[pid] != null ? Number(r.pts[pid]) : null;
      if (a != null && Number(a) === q.c) { app.innerHTML = frame(`<div class="pcard"><div class="big-emoji">🎉</div><h2 class="ok">To‘g‘ri!</h2>${p ? `<div class="pts ok">+${p}</div>` : ""}<p>${LETTERS[q.c]}) ${q.a[q.c]}</p></div>`); try { navigator.vibrate && navigator.vibrate(80); } catch (e) { } }
      else app.innerHTML = frame(`<div class="pcard"><div class="big-emoji">${a != null ? "😕" : "⌛"}</div><h2 class="no">${a != null ? "Noto‘g‘ri" : "Javob berilmadi"}</h2>${a != null ? `<p>Siz tanladingiz: <b style="color:#fff">${LETTERS[a]}</b></p>` : ""}<p>To‘g‘ri javob: <b style="color:#fff">${LETTERS[q.c]}) ${q.a[q.c]}</b></p></div>`);
      return;
    }
    if (st.phase === "open" && myAns[s.qid] != null) { app.innerHTML = frame(wait("✅", "Javobingiz qabul qilindi", `Siz tanladingiz: <b style="color:#fff">${LETTERS[myAns[s.qid]]}</b><br>Natijani kuting…`)); return; }
    app.innerHTML = frame(`<div class="pq">${q.n}/10. ${q.q}</div>
      <div class="pans ${st.phase === "read" ? "locked" : ""}">${q.a.map((t, i) => `<button class="${LETTERS[i]}" data-i="${i}"><span class="sh">${SHAPES[i]}</span><span>${t}</span></button>`).join("")}</div>
      ${st.phase === "read" ? `<p style="text-align:center;margin-top:14px;color:var(--gold)">🔒 Savolni o‘qing — o‘qituvchi «BOSHLASH»ni bosganda ochiladi</p>` : ""}`);
    if (st.phase === "open") app.querySelectorAll(".pans button").forEach(b => b.onclick = () => {
      const i = +b.dataset.i; myAns[s.qid] = i; lastKey = ""; DB.set(`${R}/answers/${s.qid}/${pid}`, { a: i, t: TS() }); draw(); try { navigator.vibrate && navigator.vibrate(30); } catch (e) { } });
  }

  function drawVote(s, g) {
    const gc = game.country || {};
    if (s.vote === "country") {
      if (st.phase === "done") { const c = COUNTRIES[gc[me.group]]; app.innerHTML = frame(wait(c ? c.flag : "🌍", c ? `Guruhingiz davlati: ${c.name}` : "Davlatlar taqsimlandi", c ? `${c.year}-yil. ${c.sit}` : "")); return; }
      const sel = myVotes.country;
      app.innerHTML = frame(`<div class="pq">${st.phase === "read" ? "🔒 Ovoz berish tez orada ochiladi. Guruhingiz bilan maslahatlashing:" : "Guruhingiz uchun davlat tanlang:"}</div>
        <div class="plist" style="--gc:${g ? g.color : "#3d8bff"}">${COUNTRIES.map((c, i) => `<button data-i="${i}" class="${sel === i ? "sel" : ""} ${st.phase === "read" ? "dis" : ""}"><span style="font-size:24px">${c.flag}</span><span><b>${c.name}, ${c.year}</b><br><small style="color:#cfd6ff">${c.sit}</small></span></button>`).join("")}</div>`);
      if (st.phase === "open") app.querySelectorAll(".plist button").forEach(b => b.onclick = () => { DB.set(`${R}/votes/country/${pid}`, +b.dataset.i); });
      return;
    }
    const c = COUNTRIES[gc[me.group]];
    if (!c) { app.innerHTML = frame(wait("⏳", "Kuting…", "")); return; }
    if (st.phase === "done") { app.innerHTML = frame(wait("📜", "Qoida qabul qilindi!", "Endi tarix gapiradi — ekranga qarang")); return; }
    const sel = myVotes.inst;
    app.innerHTML = frame(`<div class="pq">${c.flag} <b>${c.name}, ${c.year}</b><br><small style="color:var(--mut);font-weight:500">${c.sit}</small><br><br>${st.phase === "read" ? "🔒 Variantlarni o‘qing, ovoz berish tez orada ochiladi:" : "Qaysi qoidani joriy qilasiz?"}</div>
      <div class="pans ${st.phase === "read" ? "locked" : ""}">${c.opts.map((o, i) => `<button class="${LETTERS[i]} ${sel === i ? "sel" : ""}" data-i="${i}"><span class="sh">${SHAPES[i]}</span><span>${o[0]}</span></button>`).join("")}</div>`);
    if (st.phase === "open") app.querySelectorAll(".pans button").forEach(b => b.onclick = () => { DB.set(`${R}/votes/inst/${pid}`, +b.dataset.i); });
  }
}

if (IS_HOST) host(); else player();
})();

</script>
</body>
</html>
